# Netlify build configuration.
#
# NOTE: this file takes precedence over the build settings configured in the
# Netlify UI. It was added because the prerender step (scripts/prerender.mjs)
# needs a Chromium binary, which is not present in the build image by default —
# without `playwright install`, `npm run build` fails in CI.
#
# `--with-deps` pulls the shared libraries Chromium needs on the Ubuntu image.

[build]
  command = "npx playwright install --with-deps chromium && npm run build"
  publish = "dist"

[build.environment]
  # Matches the Netlify UI setting and local development. The site was pinned to
  # Node 16, which cannot run Vite 8 (requires >=20.19) — the build would have
  # failed on the first deploy after the toolchain upgrade.
  NODE_VERSION = "24"
  # Cache the browser inside the repo so Netlify's build cache can reuse it
  # between deploys instead of re-downloading ~120 MB every time.
  PLAYWRIGHT_BROWSERS_PATH = "0"
