<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/teddy-bear.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap"
    />

    <!--
      Title, description, canonical, Open Graph and Twitter tags are set per
      route by `useSeo()` (src/composables/useSeo.js) and captured into the
      static HTML by the prerender step. Only genuinely global tags belong here —
      anything page-specific duplicated below would fight unhead, and the old
      `name="og:*"` spelling would not even dedupe against unhead's correct
      `property="og:*"`.
    -->
    <title>Pediatrician in South Royalton, VT | South Royalton Health Center</title>
    <meta
      name="description"
      content="Independent, woman-owned pediatric practice in South Royalton, Vermont, serving newborns through young adults across the Upper Valley of Vermont and New Hampshire."
    />

    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#395144" />
    <meta
      name="google-site-verification"
      content="google-site-verification=IOFeyPbweoBZN8pbH_ku1gH-OsC8HoE3TohlokGbD1M"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
